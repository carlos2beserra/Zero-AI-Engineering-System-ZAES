[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "maes"
dynamic = ["version"]
description = "MAES — Context Infrastructure / Context Compiler for AI-assisted engineering"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Maxxidata", email = "devs.ia@maxxi.io" },
]
keywords = [
    "ai",
    "context",
    "compiler",
    "engineering",
    "orchestrator",
    "claude",
    "copilot",
    "cursor",
]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
]
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
anthropic = ["anthropic"]
openai    = ["openai"]
google    = ["openai"]   # Gemini uses OpenAI-compatible endpoint
mcp       = ["mcp"]
all       = ["anthropic", "openai", "mcp"]
dev       = ["pytest>=8", "build", "twine", "wheel", "setuptools>=70"]

[project.urls]
Homepage   = "https://github.com/Maxxidata/maxxi-ai-engineering-system"
Repository = "https://github.com/Maxxidata/maxxi-ai-engineering-system"

[project.scripts]
maes = "maes.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "maes.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["maes*"]

[tool.setuptools.package-data]
maes = ["templates/**/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
