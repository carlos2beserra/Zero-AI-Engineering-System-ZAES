name: MAES Context Snapshot — Métricas de síntese por release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  snapshot:
    name: Gerar métricas de contexto
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar MAES e dependências
        env:
          MAES_TOKEN: ${{ secrets.MAES_TOKEN }}
        run: |
          pip install pyyaml anthropic mcp
          if [ -f "template/scripts/tools/pyproject.toml" ]; then
            pip install -e "template/scripts/tools/[all]"
          else
            if [ -n "$MAES_TOKEN" ]; then
              git config --global url."https://x-access-token:${MAES_TOKEN}@github.com/".insteadOf "https://github.com/"
            fi
            pip install "maes[all] @ git+https://github.com/Maxxidata/maxxi-ai-engineering-system.git#subdirectory=template/scripts/tools"
          fi

      # Recompila o contexto para garantir que synthesis/ está atualizado no momento do release.
      # Não requer ANTHROPIC_API_KEY — maes sync só roda o compiler pipeline.
      - name: Recompilar contexto (maes sync)
        run: maes sync

      - name: Gerar métricas do snapshot
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          python scripts/ci/context-snapshot.py --tag "$TAG"
          echo "Snapshot de métricas gerado para $TAG"
